apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: webhook-api
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: webhook-api}
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 60}}
  behavior:
    scaleUp: {stabilizationWindowSeconds: 15}
    scaleDown: {stabilizationWindowSeconds: 120}
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: rabbitmq-auth
spec:
  secretTargetRef:
    - parameter: host
      name: lms-secrets
      key: RABBITMQ_URL
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: loan-worker
spec:
  scaleTargetRef: {name: loan-worker}
  pollingInterval: 5
  cooldownPeriod: 120
  minReplicaCount: 1
  maxReplicaCount: 6
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp: {stabilizationWindowSeconds: 10}
        scaleDown: {stabilizationWindowSeconds: 120}
  triggers:
    - type: rabbitmq
      metadata: {protocol: amqp, queueName: lms.payments, mode: QueueLength, value: '100', activationValue: '0'}
      authenticationRef: {name: rabbitmq-auth}
