                  }
                }
              }
            ]
          }
        }
      }
    },
    {
      "apiVersion": "batch/v1",
      "kind": "Job",
      "metadata": {
        "name": "simulator-migrate"
      },
      "spec": {
        "backoffLimit": 6,
        "template": {
          "spec": {
            "restartPolicy": "OnFailure",
            "automountServiceAccountToken": false,
            "containers": [
              {
                "name": "migrate",
                "image": "lms-simulator:local",
                "imagePullPolicy": "IfNotPresent",
                "args": [
                  "--migrate"
                ],
                "env": [
                  {
                    "name": "AUTH_SECRET",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "lms-secrets",
