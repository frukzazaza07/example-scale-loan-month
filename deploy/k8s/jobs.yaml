            "containers": [
              {
                "name": "migrate",
                "image": "lms-loan:local",
                "imagePullPolicy": "IfNotPresent",
                "args": [
                  "--migrate"
                ],
                "env": [
                  {
                    "name": "AUTH_SECRET",
