{
  "apiVersion": "v1",
  "kind": "List",
  "items": [
    {
      "apiVersion": "batch/v1",
      "kind": "Job",
      "metadata": {
        "name": "webhook-api-migrate"
      },
      "spec": {
        "backoffLimit": 6,
        "template": {
          "spec": {
            "restartPolicy": "OnFailure",
            "automountServiceAccountToken": false,
            "containers": [
              {
                "name": "migrate",
                "image": "lms-webhook:local",
                "imagePullPolicy": "IfNotPresent",
                "args": [
                  "--migrate"
                ],
                "env": [
                  {
                    "name": "AUTH_SECRET",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "lms-secrets",
                        "key": "AUTH_SECRET"
                      }
                    }
                  },
                  {
                    "name": "DATABASE_URL",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "lms-secrets",
                        "key": "DB_URL_WEBHOOK"
                      }
                    }
                  },
                  {
                    "name": "BANK_SECRET",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "lms-secrets",
                        "key": "BANK_SECRET"
                      }
                    }
                  }
                ],
                "resources": {
                  "requests": {
                    "cpu": "100m",
                    "memory": "128Mi"
                  },
                  "limits": {
                    "cpu": "1000m",
                    "memory": "512Mi"
                  }
                }
              }
            ]
          }
        }
      }
    },
    {
      "apiVersion": "batch/v1",
