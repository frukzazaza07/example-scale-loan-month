        "backoffLimit": 6,
        "template": {
          "spec": {
            "restartPolicy": "OnFailure",
            "automountServiceAccountToken": false,
            "containers": [
              {
                "name": "migrate",
                "image": "lms-notification:local",
                "imagePullPolicy": "IfNotPresent",
                "args": [
                  "--migrate"
                ],
                "env": [
                  {
                    "name": "AUTH_SECRET",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "lms-secrets",
                        "key": "AUTH_SECRET"
                      }
                    }
                  },
                  {
                    "name": "DATABASE_URL",
                    "valueFrom": {
