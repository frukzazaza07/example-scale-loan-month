                      "secretKeyRef": {
                        "name": "lms-secrets",
                        "key": "AUTH_SECRET"
                      }
                    }
                  },
                  {
                    "name": "DATABASE_URL",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "lms-secrets",
                        "key": "DB_URL_LOAN"
                      }
                    }
                  }
                ],
                "resources": {
                  "requests": {
                    "cpu": "100m",
                    "memory": "128Mi"
                  },
                  "limits": {
                    "cpu": "1000m",
