apiVersion: v1
kind: ServiceAccount
metadata: {name: demo-telemetry}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: demo-telemetry}
rules:
  - apiGroups: ['apps']
    resources: ['deployments']
    verbs: ['get', 'list']
  - apiGroups: ['autoscaling']
    resources: ['horizontalpodautoscalers']
    verbs: ['get', 'list']
  - apiGroups: ['keda.sh']
    resources: ['scaledobjects']
    verbs: ['get', 'list']
  - apiGroups: ['']
    resources: ['pods']
    verbs: ['get', 'list']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: demo-telemetry}
subjects: [{kind: ServiceAccount, name: demo-telemetry}]
roleRef: {kind: Role, name: demo-telemetry, apiGroup: rbac.authorization.k8s.io}
