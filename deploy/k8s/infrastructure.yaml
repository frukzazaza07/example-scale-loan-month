{
    "apiVersion":  "v1",
    "kind":  "List",
    "items":  [
                  {
                      "apiVersion":  "v1",
                      "kind":  "ConfigMap",
                      "metadata":  {
                                       "name":  "database-init"
                                   },
                      "data":  {
                                   "01-services.sh":  "#!/bin/sh\nset -eu\npsql -v ON_ERROR_STOP=1 --username \"$POSTGRES_USER\" --dbname postgres \\\n  -v webhook_password=\"$WEBHOOK_DB_PASSWORD\" -v loan_password=\"$LOAN_DB_PASSWORD\" \\\n  -v notification_password=\"$NOTIFICATION_DB_PASSWORD\" -v simulator_password=\"$SIMULATOR_DB_PASSWORD\" \u003c\u003c\u0027SQL\u0027\nCREATE ROLE webhook LOGIN PASSWORD :\u0027webhook_password\u0027;\nCREATE ROLE loan LOGIN PASSWORD :\u0027loan_password\u0027;\nCREATE ROLE notification LOGIN PASSWORD :\u0027notification_password\u0027;\nCREATE ROLE simulator LOGIN PASSWORD :\u0027simulator_password\u0027;\nCREATE DATABASE webhook OWNER webhook;\nCREATE DATABASE loan OWNER loan;\nCREATE DATABASE notification OWNER notification;\nCREATE DATABASE simulator OWNER simulator;\nREVOKE CONNECT ON DATABASE webhook, loan, notification, simulator FROM PUBLIC;\nGRANT CONNECT ON DATABASE webhook TO webhook;\nGRANT CONNECT ON DATABASE loan TO loan;\nGRANT CONNECT ON DATABASE notification TO notification;\nGRANT CONNECT ON DATABASE simulator TO simulator;\nSQL\n\r\n"
                               }
                  },
                  {
                      "apiVersion":  "v1",
                      "kind":  "PersistentVolumeClaim",
                      "metadata":  {
                                       "name":  "postgres-data"
                                   },
                      "spec":  {
                                   "accessModes":  [
                                                       "ReadWriteOnce"
                                                   ],
                                   "resources":  {
                                                     "requests":  {
                                                                      "storage":  "2Gi"
                                                                  }
                                                 }
                               }
                  },
                  {
                      "apiVersion":  "apps/v1",
                      "kind":  "Deployment",
                      "metadata":  {
                                       "name":  "postgres"
                                   },
                      "spec":  {
                                   "replicas":  1,
                                   "strategy":  {
                                                    "type":  "Recreate"
                                                },
                                   "selector":  {
                                                    "matchLabels":  {
                                                                        "app":  "postgres"
                                                                    }
                                                },
                                   "template":  {
                                                    "metadata":  {
                                                                     "labels":  {
                                                                                    "app":  "postgres"
                                                                                }
                                                                 },
                                                    "spec":  {
                                                                 "automountServiceAccountToken":  false,
                                                                 "terminationGracePeriodSeconds":  60,
                                                                 "containers":  [
                                                                                    {
                                                                                        "name":  "postgres",
                                                                                        "image":  "postgres:17.6-alpine",
                                                                                        "env":  [
                                                                                                    {
                                                                                                        "name":  "POSTGRES_USER",
                                                                                                        "value":  "postgres"
                                                                                                    },
                                                                                                    {
                                                                                                        "name":  "POSTGRES_PASSWORD",
                                                                                                        "valueFrom":  {
                                                                                                                          "secretKeyRef":  {
                                                                                                                                               "name":  "lms-secrets",
                                                                                                                                               "key":  "POSTGRES_ADMIN_PASSWORD"
                                                                                                                                           }
                                                                                                                      }
                                                                                                    },
                                                                                                    {
                                                                                                        "name":  "WEBHOOK_DB_PASSWORD",
                                                                                                        "valueFrom":  {
                                                                                                                          "secretKeyRef":  {
                                                                                                                                               "name":  "lms-secrets",
                                                                                                                                               "key":  "WEBHOOK_DB_PASSWORD"
                                                                                                                                           }
                                                                                                                      }
                                                                                                    },
                                                                                                    {
                                                                                                        "name":  "LOAN_DB_PASSWORD",
                                                                                                        "valueFrom":  {
                                                                                                                          "secretKeyRef":  {
                                                                                                                                               "name":  "lms-secrets",
                                                                                                                                               "key":  "LOAN_DB_PASSWORD"
                                                                                                                                           }
                                                                                                                      }
                                                                                                    },
                                                                                                    {
                                                                                                        "name":  "NOTIFICATION_DB_PASSWORD",
                                                                                                        "valueFrom":  {
                                                                                                                          "secretKeyRef":  {
                                                                                                                                               "name":  "lms-secrets",
                                                                                                                                               "key":  "NOTIFICATION_DB_PASSWORD"
                                                                                                                                           }
                                                                                                                      }
                                                                                                    },
                                                                                                    {
                                                                                                        "name":  "SIMULATOR_DB_PASSWORD",
                                                                                                        "valueFrom":  {
                                                                                                                          "secretKeyRef":  {
                                                                                                                                               "name":  "lms-secrets",
                                                                                                                                               "key":  "SIMULATOR_DB_PASSWORD"
                                                                                                                                           }
                                                                                                                      }
                                                                                                    }
                                                                                                ],
                                                                                        "ports":  [
                                                                                                      {
                                                                                                          "containerPort":  5432
                                                                                                      }
                                                                                                  ],
                                                                                        "resources":  {
                                                                                                          "requests":  {
                                                                                                                           "cpu":  "100m",
                                                                                                                           "memory":  "256Mi"
                                                                                                                       },
                                                                                                          "limits":  {
                                                                                                                         "cpu":  "2000m",
                                                                                                                         "memory":  "1Gi"
                                                                                                                     }
                                                                                                      },
                                                                                        "readinessProbe":  {
                                                                                                               "exec":  {
                                                                                                                            "command":  [
                                                                                                                                            "pg_isready",
                                                                                                                                            "-U",
                                                                                                                                            "postgres"
                                                                                                                                        ]
                                                                                                                        },
                                                                                                               "initialDelaySeconds":  10,
                                                                                                               "periodSeconds":  10
                                                                                                           },
                                                                                        "livenessProbe":  {
                                                                                                              "tcpSocket":  {
                                                                                                                                "port":  5432
                                                                                                                            },
                                                                                                              "initialDelaySeconds":  30,
                                                                                                              "periodSeconds":  15
                                                                                                          },
                                                                                        "volumeMounts":  [
                                                                                                             {
                                                                                                                 "name":  "data",
                                                                                                                 "mountPath":  "/var/lib/postgresql/data"
                                                                                                             },
                                                                                                             {
                                                                                                                 "name":  "init",
                                                                                                                 "mountPath":  "/docker-entrypoint-initdb.d"
                                                                                                             }
                                                                                                         ],
                                                                                        "args":  [
                                                                                                     "postgres",
                                                                                                     "-c",
                                                                                                     "max_connections=200"
                                                                                                 ]
                                                                                    }
                                                                                ],
                                                                 "volumes":  [
                                                                                 {
                                                                                     "name":  "data",
                                                                                     "persistentVolumeClaim":  {
                                                                                                                   "claimName":  "postgres-data"
                                                                                                               }
                                                                                 },
                                                                                 {
                                                                                     "name":  "init",
                                                                                     "configMap":  {
                                                                                                       "name":  "database-init"
                                                                                                   }
                                                                                 }
                                                                             ]
                                                             }
                                                }
                               }
                  },
                  {
                      "apiVersion":  "v1",
                      "kind":  "Service",
                      "metadata":  {
                                       "name":  "postgres"
                                   },
                      "spec":  {
                                   "selector":  {
                                                    "app":  "postgres"
                                                },
                                   "ports":  [
                                                 {
                                                     "name":  "primary",
                                                     "port":  5432,
                                                     "targetPort":  5432
                                                 }
                                             ]
                               }
                  },
                  {
                      "apiVersion":  "v1",
                      "kind":  "PersistentVolumeClaim",
                      "metadata":  {
                                       "name":  "rabbitmq-data"
                                   },
                      "spec":  {
                                   "accessModes":  [
                                                       "ReadWriteOnce"
                                                   ],
                                   "resources":  {
                                                     "requests":  {
                                                                      "storage":  "2Gi"
                                                                  }
                                                 }
                               }
                  },
                  {
                      "apiVersion":  "apps/v1",
                      "kind":  "Deployment",
                      "metadata":  {
                                       "name":  "rabbitmq"
                                   },
                      "spec":  {
                                   "replicas":  1,
                                   "strategy":  {
                                                    "type":  "Recreate"
                                                },
                                   "selector":  {
                                                    "matchLabels":  {
                                                                        "app":  "rabbitmq"
                                                                    }
                                                },
                                   "template":  {
                                                    "metadata":  {
                                                                     "labels":  {
                                                                                    "app":  "rabbitmq"
                                                                                }
                                                                 },
                                                    "spec":  {
                                                                 "automountServiceAccountToken":  false,
                                                                 "terminationGracePeriodSeconds":  60,
                                                                 "containers":  [
                                                                                    {
                                                                                        "name":  "rabbitmq",
                                                                                        "image":  "rabbitmq:4.1.4-management-alpine",
                                                                                        "env":  [
                                                                                                    {
                                                                                                        "name":  "RABBITMQ_DEFAULT_USER",
                                                                                                        "valueFrom":  {
                                                                                                                          "secretKeyRef":  {
                                                                                                                                               "name":  "lms-secrets",
                                                                                                                                               "key":  "RABBITMQ_USER"
                                                                                                                                           }
                                                                                                                      }
                                                                                                    },
                                                                                                    {
                                                                                                        "name":  "RABBITMQ_DEFAULT_PASS",
                                                                                                        "valueFrom":  {
                                                                                                                          "secretKeyRef":  {
                                                                                                                                               "name":  "lms-secrets",
                                                                                                                                               "key":  "RABBITMQ_PASSWORD"
                                                                                                                                           }
                                                                                                                      }
                                                                                                    },
                                                                                                    {
                                                                                                        "value":  "rabbit@rabbitmq",
                                                                                                        "name":  "RABBITMQ_NODENAME"
                                                                                                    }
                                                                                                ],
                                                                                        "ports":  [
                                                                                                      {
                                                                                                          "containerPort":  5672
                                                                                                      },
                                                                                                      {
                                                                                                          "containerPort":  15672
                                                                                                      }
                                                                                                  ],
                                                                                        "resources":  {
                                                                                                          "requests":  {
                                                                                                                           "cpu":  "100m",
                                                                                                                           "memory":  "256Mi"
                                                                                                                       },
                                                                                                          "limits":  {
                                                                                                                         "cpu":  "2000m",
                                                                                                                         "memory":  "1Gi"
                                                                                                                     }
                                                                                                      },
                                                                                        "readinessProbe":  {
                                                                                                               "exec":  {
                                                                                                                            "command":  [
                                                                                                                                            "rabbitmq-diagnostics",
                                                                                                                                            "-q",
                                                                                                                                            "ping"
                                                                                                                                        ]
                                                                                                                        },
                                                                                                               "initialDelaySeconds":  10,
                                                                                                               "periodSeconds":  10,
                                                                                                               "timeoutSeconds":  10,
                                                                                                               "failureThreshold":  3
                                                                                                           },
                                                                                        "livenessProbe":  {
                                                                                                              "tcpSocket":  {
                                                                                                                                "port":  5672
                                                                                                                            },
                                                                                                              "initialDelaySeconds":  30,
                                                                                                              "periodSeconds":  15
                                                                                                          },
                                                                                        "volumeMounts":  [
                                                                                                             {
                                                                                                                 "name":  "data",
                                                                                                                 "mountPath":  "/var/lib/rabbitmq"
                                                                                                             }
                                                                                                         ]
                                                                                    }
                                                                                ],
                                                                 "volumes":  [
                                                                                 {
                                                                                     "name":  "data",
                                                                                     "persistentVolumeClaim":  {
                                                                                                                   "claimName":  "rabbitmq-data"
                                                                                                               }
                                                                                 }
                                                                             ],
                                                                 "hostname":  "rabbitmq"
                                                             }
                                                }
                               }
                  },
                  {
                      "apiVersion":  "v1",
                      "kind":  "Service",
                      "metadata":  {
                                       "name":  "rabbitmq"
                                   },
                      "spec":  {
                                   "selector":  {
                                                    "app":  "rabbitmq"
                                                },
                                   "ports":  [
                                                 {
                                                     "name":  "primary",
                                                     "port":  5672,
                                                     "targetPort":  5672
                                                 },
                                                 {
                                                     "name":  "management",
                                                     "port":  15672,
                                                     "targetPort":  15672
                                                 }
                                             ]
                               }
                  }
              ]
}
