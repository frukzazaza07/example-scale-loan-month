{
  "apiVersion": "v1",
  "kind": "List",
  "items": [
    {
      "apiVersion": "v1",
      "kind": "ConfigMap",
      "metadata": {
        "name": "prometheus"
      },
      "data": {
        "prometheus.yml": "global:\n  scrape_interval: 5s\nscrape_configs:\n  - job_name: lms\n    kubernetes_sd_configs:\n      - role: pod\n        namespaces:\n          names: [lms-demo]\n    relabel_configs:\n      - source_labels: [__meta_kubernetes_pod_label_app]\n        regex: webhook-api|loan-api|loan-worker|notification|simulator|demo-api\n        action: keep\n      - source_labels: [__meta_kubernetes_pod_container_port_number]\n        regex: '8080'\n        action: keep\n      - source_labels: [__meta_kubernetes_pod_label_app]\n        target_label: service\n      - source_labels: [__meta_kubernetes_pod_name]\n        target_label: pod\n"
      }
    },
    {
      "apiVersion": "v1",
      "kind": "ServiceAccount",
      "metadata": {
        "name": "prometheus"
      }
    },
    {
      "apiVersion": "rbac.authorization.k8s.io/v1",
      "kind": "Role",
      "metadata": {
        "name": "prometheus"
      },
      "rules": [
        {
          "apiGroups": [
            ""
          ],
          "resources": [
            "pods"
          ],
          "verbs": [
            "get",
            "list",
            "watch"
          ]
        }
      ]
    },
    {
      "apiVersion": "rbac.authorization.k8s.io/v1",
      "kind": "RoleBinding",
      "metadata": {
        "name": "prometheus"
      },
      "subjects": [
        {
          "kind": "ServiceAccount",
          "name": "prometheus"
        }
      ],
      "roleRef": {
        "kind": "Role",
        "name": "prometheus",
        "apiGroup": "rbac.authorization.k8s.io"
      }
    },
    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "name": "prometheus"
      },
      "spec": {
        "replicas": 1,
        "selector": {
          "matchLabels": {
            "app": "prometheus"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app": "prometheus"
            }
          },
          "spec": {
            "serviceAccountName": "prometheus",
            "containers": [
              {
                "name": "prometheus",
                "image": "prom/prometheus:v3.5.0",
                "args": [
                  "--config.file=/etc/prometheus/prometheus.yml",
                  "--storage.tsdb.retention.time=1d"
                ],
                "ports": [
                  {
                    "containerPort": 9090
                  }
                ],
                "volumeMounts": [
                  {
                    "name": "config",
                    "mountPath": "/etc/prometheus"
                  },
                  {
                    "name": "data",
                    "mountPath": "/prometheus"
                  }
                ],
                "resources": {
                  "requests": {
                    "cpu": "100m",
                    "memory": "128Mi"
                  },
                  "limits": {
                    "cpu": "500m",
                    "memory": "512Mi"
                  }
                },
                "readinessProbe": {
                  "httpGet": {
                    "path": "/-/ready",
                    "port": 9090
                  }
                }
              }
            ],
            "volumes": [
              {
                "name": "config",
                "configMap": {
                  "name": "prometheus"
                }
              },
              {
                "name": "data",
                "emptyDir": {}
              }
            ]
          }
        }
      }
    },
    {
      "apiVersion": "v1",
      "kind": "Service",
      "metadata": {
        "name": "prometheus"
      },
      "spec": {
        "selector": {
          "app": "prometheus"
        },
        "ports": [
          {
            "port": 9090,
            "targetPort": 9090
          }
        ]
      }
    }
  ]
}
