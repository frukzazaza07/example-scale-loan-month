apiVersion: v1
kind: Secret
metadata: {name: lms-secrets, namespace: lms-demo}
type: Opaque
stringData:
  AUTH_SECRET: REPLACE-with-a-long-local-demo-secret
  BANK_SECRET: REPLACE-with-an-independent-long-secret
  ADMIN_PASSWORD: REPLACE
  OBSERVER_PASSWORD: REPLACE
  POSTGRES_ADMIN_PASSWORD: REPLACE
  WEBHOOK_DB_PASSWORD: REPLACE
  LOAN_DB_PASSWORD: REPLACE
  NOTIFICATION_DB_PASSWORD: REPLACE
  SIMULATOR_DB_PASSWORD: REPLACE
  RABBITMQ_USER: lms
  RABBITMQ_PASSWORD: REPLACE
  RABBITMQ_URL: amqp://lms:REPLACE@rabbitmq.lms-demo.svc.cluster.local:5672
  DB_URL_WEBHOOK: Host=postgres;Database=webhook;Username=webhook;Password=REPLACE;Maximum Pool Size=5
  DB_URL_LOAN: Host=postgres;Database=loan;Username=loan;Password=REPLACE;Maximum Pool Size=5
  DB_URL_NOTIFICATION: Host=postgres;Database=notification;Username=notification;Password=REPLACE;Maximum Pool Size=5
  DB_URL_SIMULATOR: Host=postgres;Database=simulator;Username=simulator;Password=REPLACE;Maximum Pool Size=5
  SEED_CONNECTION: postgresql://loan:REPLACE@postgres:5432/loan


